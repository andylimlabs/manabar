name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly advisory sweep: new RustSec/npm advisories publish continuously
    - cron: "0 14 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          # required when the action is SHA-pinned: it normally infers the
          # toolchain from the "@stable" ref, which a SHA pin erases
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: npm audit (prod)
        run: npm audit --omit=dev

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses
